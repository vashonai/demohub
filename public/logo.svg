<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="aivoraGrad1" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="aivoraGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="aivoraGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient background glow badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#aivoraGlow)" />
  <rect x="7" y="7" width="106" height="106" rx="27" stroke="url(#aivoraGrad1)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized Geometric "A" -->
  <g filter="url(#softShadow)">
    <!-- Left Ascender -->
    <path
      d="M60 22 L24 88 C23 90 25 93 28 93 L38 93 C40.5 93 42.5 91.5 43.5 89.5 L51 74 L69 74 L76.5 89.5 C77.5 91.5 79.5 93 82 93 L92 93 C95 93 97 90 96 88 L60 22 Z"
      fill="url(#aivoraGrad1)"
    />
    <!-- Inner Core Cutout / Diamond Spark -->
    <path
      d="M60 38 L54 62 L66 62 Z"
      fill="#ffffff"
      fill-opacity="0.95"
    />
    <!-- Floating Node / Pulse Accent -->
    <circle cx="60" cy="50" r="3.5" fill="#6366f1" />
    <!-- Glowing Crossbar Accent -->
    <rect x="42" y="70" width="36" height="4" rx="2" fill="url(#aivoraGrad2)" />
